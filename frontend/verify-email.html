<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Verify Email</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-body">

    <div class="auth-card verify-card" style="max-width: 440px;">

        <div class="verify-icon" aria-hidden="true">
            🔐
        </div>

        <h2>Verify Email OTP</h2>

        <p class="subtitle">
            Enter your email and the 6-digit verification code to activate your Dayflow account.
        </p>

        <form id="verifyEmailForm" onsubmit="handleDirectVerifyEmail(event)">

            <div class="form-group" style="text-align: left;">
                <label for="directVerifyEmail">Email Address</label>
                <input
                    type="email"
                    id="directVerifyEmail"
                    placeholder="user@dayflow.com"
                    required
                >
            </div>

            <div class="form-group" style="text-align: left;">
                <label for="directVerifyOtp">6-Digit Code</label>
                <input
                    type="text"
                    id="directVerifyOtp"
                    placeholder="123456"
                    maxlength="6"
                    inputmode="numeric"
                    style="letter-spacing: 4px; font-size: 18px; text-align: center; font-weight: 700;"
                    required
                >
            </div>

            <p id="verifyMessage" class="error-message"></p>

            <button
                type="submit"
                class="primary-btn"
            >
                Confirm & Activate Account
            </button>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <button type="button" class="secondary-btn" onclick="resendDirectVerifyOtp()" style="padding: 6px 12px; font-size: 12px;">
                    🔄 Resend OTP
                </button>
                <span id="directOtpTimer" style="font-size: 12px; color: #6b7280;"></span>
            </div>

        </form>

        <a href="index.html" class="back-link">
            Back to Sign In
        </a>

    </div>

   <script src="../js/script.js"></script>
</body>
</html>
