<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Notifications</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <h2>Dayflow</h2>
            <span>Notifications</span>
        </div>

        <nav>
            <a id="navDashboard" href="employee-dashboard.html">
                <span class="nav-icon">📊</span>
                <span>Dashboard</span>
            </a>

            <a href="profile.html">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>

            <a href="attendance.html">
                <span class="nav-icon">🕒</span>
                <span>Attendance</span>
            </a>

            <a href="leave.html">
                <span class="nav-icon">📅</span>
                <span>Leave Requests</span>
            </a>

            <a href="payroll.html">
                <span class="nav-icon">💰</span>
                <span>Payroll</span>
            </a>

            <a href="notifications.html" class="active">
                <span class="nav-icon">🔔</span>
                <span>Notifications</span>
            </a>

            <a href="reports.html">
                <span class="nav-icon">📈</span>
                <span>Reports</span>
            </a>
        </nav>

        <button type="button" class="logout-btn" onclick="logout()">
            <span class="nav-icon">🚪</span>
            <span>Logout</span>
        </button>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h2>Alerts & Notifications</h2>
                <p>Stay informed on attendance records, approvals, and payroll dispatches.</p>
            </div>

            <div class="user-box">
                <div class="avatar">U</div>
                <span>User</span>
            </div>

        </header>


        <section class="dashboard-content">

            <div class="section-card">

                <div class="section-header">
                    <h3>Recent System Alerts</h3>
                    <button type="button" class="secondary-btn" onclick="markAllNotificationsAsRead()">
                        ✓ Mark All as Read
                    </button>
                </div>

                <div id="notificationsList">
                    <p style="text-align: center; color: #6b7280; padding: 20px;">Loading notifications...</p>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="../js/script.js"></script>
</body>
</html>
